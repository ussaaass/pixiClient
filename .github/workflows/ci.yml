name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 测试 / 构建 / 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 静态检查（ESLint，packages / games / apps/server）
        run: pnpm lint
      - name: 静态检查（ESLint，apps/web / apps/admin）
        run: pnpm lint:apps
      - name: 格式检查（Prettier）
        run: pnpm format:check
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元与契约测试
        run: pnpm test
      - name: 构建
        run: pnpm build
      # 第七关：OpenAPI 生成与 diff（`docs/09_agent/OPENAPI.md`）
      # 生成器把 `packages/contracts` 的 TypeBox schema 原样拼成 OpenAPI 3.1 JSON。
      # `openapi:check` 在 CI 上对比 `packages/contracts/dist/openapi.json` 与重新生成产物，
      # 破坏性 schema 变更（additionalProperties / 字段删除 / 枚举语义）在合并前被发现。
      - name: 生成 OpenAPI 文档
        run: pnpm --filter @gameing/contracts openapi
      - name: 校验 OpenAPI 文档与注册表一致
        run: pnpm --filter @gameing/contracts openapi:check
