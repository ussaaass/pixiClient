name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 测试 / 构建 / 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 静态检查（ESLint，packages / games / apps/server）
        run: pnpm lint
      - name: 静态检查（ESLint，apps/web / apps/admin）
        run: pnpm lint:apps
      - name: 格式检查（Prettier）
        run: pnpm format:check
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元与契约测试
        run: pnpm test
      - name: 构建
        run: pnpm build
